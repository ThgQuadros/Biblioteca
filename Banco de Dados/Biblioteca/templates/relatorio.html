{% extends "base.html" %}

{% block conteudo %}
<div class="card-soft p-4 p-md-5">
    <h2 class="fw-bold mb-3">Relatório</h2>
    <p class="text-muted mb-4">Resumo rápido do estado atual da biblioteca.</p>
    <div class="row g-3">
        <div class="col-md-4">
            <div class="card-soft p-4 text-center">
                <h3 class="display-6 fw-bold mb-1">{{ total }}</h3>
                <p class="text-muted mb-0">Total de livros</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-soft p-4 text-center">
                <h3 class="display-6 fw-bold mb-1">{{ emprestados }}</h3>
                <p class="text-muted mb-0">Emprestados</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card-soft p-4 text-center">
                <h3 class="display-6 fw-bold mb-1">{{ disponiveis }}</h3>
                <p class="text-muted mb-0">Disponíveis</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
