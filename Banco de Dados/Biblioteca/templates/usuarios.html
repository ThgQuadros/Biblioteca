{% extends "base.html" %}

{% block conteudo %}
<h2>Usuários</h2>
<a class="btn btn-primary mb-3" href="{{ url_for('novo_usuario') }}">Novo Usuário</a>

<table class="table table-striped">
    <thead>
        <tr>
            <th>Matrícula</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Telefone</th>
        </tr>
    </thead>
    <tbody>
        {% for matricula, nome, email, telefone in usuarios %}
        <tr>
            <td>{{ matricula }}</td>
            <td>{{ nome }}</td>
            <td>{{ email or "" }}</td>
            <td>{{ telefone or "" }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
