<!doctype html>
<html lang="pt-br">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Biblioteca</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
        <style>
            :root {
                --azul: #2f6fed;
                --azul-escuro: #163a72;
                --cinza: #f5f7fb;
                --texto: #21364f;
                --borda: #dfe8f7;
            }
            body {
                background: linear-gradient(135deg, #f7fbff 0%, #eef4ff 100%);
                color: var(--texto);
                font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            }
            .page-shell {
                max-width: 1200px;
                margin: 0 auto;
                padding: 24px 16px 40px;
            }
            .navbar-elegant {
                background: linear-gradient(90deg, var(--azul-escuro) 0%, var(--azul) 100%);
                border: 1px solid rgba(255,255,255,0.15);
                box-shadow: 0 10px 30px rgba(22, 58, 114, 0.18);
            }
            .navbar-elegant .nav-link {
                color: #ffffff;
                font-weight: 500;
                border-radius: 999px;
                padding: 8px 12px;
                transition: background-color 0.2s ease;
            }
            .navbar-elegant .nav-link:hover,
            .navbar-elegant .nav-link.active {
                background-color: rgba(255,255,255,0.16);
                color: #ffffff;
            }
            .card-soft {
                background: #ffffff;
                border: 1px solid var(--borda);
                border-radius: 18px;
                box-shadow: 0 12px 30px rgba(31, 60, 110, 0.08);
            }
            .hero-card {
                background: linear-gradient(135deg, #ffffff 0%, #f4f8ff 100%);
                border: 1px solid var(--borda);
                border-radius: 22px;
                box-shadow: 0 14px 34px rgba(22, 58, 114, 0.08);
            }
            .btn-primary-custom {
                background: linear-gradient(90deg, var(--azul) 0%, #4b87ff 100%);
                border: none;
                color: white;
            }
            .btn-primary-custom:hover {
                filter: brightness(1.05);
                color: white;
            }
            .table thead {
                background-color: #eef4ff;
                color: var(--azul-escuro);
            }
            .form-control, .form-select {
                border-radius: 12px;
                border: 1px solid var(--borda);
                padding: 10px 12px;
            }
            .form-control:focus, .form-select:focus {
                border-color: var(--azul);
                box-shadow: 0 0 0 0.2rem rgba(47,111,237,0.15);
            }
        </style>
    </head>
    <body>
        <div class="page-shell">
            <nav class="navbar navbar-expand-lg navbar-elegant rounded-4 mb-4 px-3">
                <div class="container-fluid">
                    <a class="navbar-brand text-white fw-bold" href="{{ url_for('home') }}">📚 Biblioteca</a>
                    <div class="navbar-nav ms-auto">
                        <a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}" href="{{ url_for('home') }}">Início</a>
                        <a class="nav-link {% if request.endpoint == 'listar_livros' %}active{% endif %}" href="{{ url_for('listar_livros') }}">Livros</a>
                        <a class="nav-link {% if request.endpoint == 'listar_usuarios' %}active{% endif %}" href="{{ url_for('listar_usuarios') }}">Usuários</a>
                        <a class="nav-link {% if request.endpoint == 'novo_emprestimo' %}active{% endif %}" href="{{ url_for('novo_emprestimo') }}">Emprestar</a>
                        <a class="nav-link {% if request.endpoint == 'devolver_livro' %}active{% endif %}" href="{{ url_for('devolver_livro') }}">Devolver</a>
                        <a class="nav-link {% if request.endpoint == 'relatorio' %}active{% endif %}" href="{{ url_for('relatorio') }}">Relatório</a>
                    </div>
                </div>
            </nav>

            {% block conteudo %}{% endblock %}
        </div>
    </body>
</html>
