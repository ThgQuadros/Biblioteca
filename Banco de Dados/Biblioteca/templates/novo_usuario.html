{% extends "base.html" %}

{% block conteudo %}
<div class="card-soft p-4 p-md-5">
    <h2 class="fw-bold mb-3">Novo usuário</h2>
    <p class="text-muted mb-4">Cadastre um novo usuário para o sistema.</p>

    <form method="post">
      <div class="mb-3">
        <label class="form-label">Matrícula</label>
        <input type="text" name="matricula" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" name="nome" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control">
      </div>
      <div class="mb-3">
        <label class="form-label">Telefone</label>
        <input type="text" name="telefone" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary-custom">Salvar</button>
      <a href="{{ url_for('listar_usuarios') }}" class="btn btn-outline-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
