{% extends "base.html" %}

{% block conteudo %}
<div class="hero-card p-4 p-md-5">
    <div class="row align-items-center">
        <div class="col-md-8">
            <h1 class="display-6 fw-bold mb-3">Sistema de Biblioteca</h1>
            <p class="lead text-muted mb-4">Gerencie livros, usuários, empréstimos e devoluções com uma interface limpa e elegante.</p>
            <a href="{{ url_for('listar_livros') }}" class="btn btn-primary-custom px-4 py-2">Ver livros</a>
            <a href="{{ url_for('listar_usuarios') }}" class="btn btn-outline-secondary px-4 py-2 ms-2">Ver usuários</a>
        </div>
        <div class="col-md-4 text-center">
            <div class="card-soft p-4">
                <h3 class="fw-bold mb-2">Bem-vindo</h3>
                <p class="text-muted mb-0">Organize seu acervo com praticidade e estilo.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
