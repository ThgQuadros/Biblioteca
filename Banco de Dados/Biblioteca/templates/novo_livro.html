{% extends "base.html" %}

{% block conteudo %}
<div class="card-soft p-4 p-md-5">
    <h2 class="fw-bold mb-3">Novo livro</h2>
    <p class="text-muted mb-4">Cadastre um novo item no acervo.</p>

    <form method="post">
      <div class="mb-3">
        <label class="form-label">Código</label>
        <input type="text" name="codigo" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" name="titulo" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Autor</label>
        <input type="text" name="autor" class="form-control" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Ano</label>
        <input type="number" name="ano" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary-custom">Salvar</button>
      <a href="{{ url_for('listar_livros') }}" class="btn btn-outline-secondary">Voltar</a>
    </form>
</div>
{% endblock %}
